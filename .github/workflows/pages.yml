# Build and deploy the site to GitHub Pages.
#
# This replaces the classic "deploy from a branch" Pages build, which could not
# run the InspireHEP fetch step that /public/publications.html needs.
#
# REQUIRED ONE-TIME SETUP: Settings -> Pages -> Source must be set to
# "GitHub Actions".  Until that is done the deploy job below cannot publish.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Refresh the publication graph even when nobody has touched the content,
  # so new citations show up on their own.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A job-level permissions block replaces the workflow-level one
    # entirely, so contents: read has to be repeated here for checkout.
    # pages: write is required (not just in deploy) because
    # actions/configure-pages calls the Pages API to look up/enable the
    # site; without it the step fails even though this job never deploys.
    permissions:
      contents: read
      pages: write
    # actions/configure-pages sets GITHUB_PAGES=true, which wakes the
    # jekyll-github-metadata plugin that ships with the github-pages gem.
    # The classic Pages builder also sets PAGES_REPO_NWO; a workflow has to
    # supply it, or the plugin fails with "No repo name found" while
    # resolving baseurl.
    env:
      PAGES_REPO_NWO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check PyYAML

      - name: Check the publication graph logic
        run: python3 tools/tests/test_inspire_graph.py

      # Keyed on the publication list so editing it starts a fresh cache, and
      # on the run id so every run saves an updated one.  restore-keys fall
      # back to the most recent cache for the same list, then to any cache.
      - name: Restore the InspireHEP cache
        uses: actions/cache@v4
        with:
          path: .cache/inspire
          key: inspire-${{ hashFiles('_data/publications.yml') }}-${{ github.run_id }}
          restore-keys: |
            inspire-${{ hashFiles('_data/publications.yml') }}-
            inspire-

      # --fail-soft: an InspireHEP outage must never block a site deploy.
      - name: Build the publication graph
        run: python3 tools/inspire_graph.py --fail-soft --verbose

      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Scoped to this job (not the whole workflow) so PR/schedule builds
    # never wait on or block an in-progress deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
